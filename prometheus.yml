# Prometheus scrape configuration for Planly.
# Used by docker-compose.prod.yml.
# Requires METRICS_SECRET set in .env — the backend rejects unauthenticated scrapes.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: planly
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:3000']
    metrics_path: /api/metrics
    # Replace CHANGE_ME with the value of METRICS_SECRET from .env.
    # Prometheus does not support env var substitution in this file.
    # Alternatively, use bearer_token_file pointing to a file containing the secret.
    bearer_token: "CHANGE_ME"
