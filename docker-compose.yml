services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planly
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-80}
      UPLOADS_DIR: /data/uploads
      # ── Email (optional) ────────────────────────────────────────────────────
      # Leave SMTP_HOST unset to disable email features (password reset, invites).
      # Works with any standard SMTP provider — set the vars for your provider:
      #
      #  Gmail (free, needs App Password from myaccount.google.com/apppasswords):
      #    SMTP_HOST: smtp.gmail.com
      #    SMTP_PORT: 587
      #    SMTP_USER: you@gmail.com
      #    SMTP_PASS: <16-char app password>
      #
      #  Outlook / Hotmail / Microsoft 365:
      #    SMTP_HOST: smtp-mail.outlook.com
      #    SMTP_PORT: 587
      #
      #  Apple iCloud Mail (needs App-Specific Password from appleid.apple.com):
      #    SMTP_HOST: smtp.mail.me.com
      #    SMTP_PORT: 587
      #
      #  ProtonMail (requires Proton Mail Bridge running locally):
      #    SMTP_HOST: 127.0.0.1
      #    SMTP_PORT: 1025
      #    SMTP_SECURE: "false"
      #
      #  Resend / Brevo / Mailgun / any custom SMTP:
      #    SMTP_HOST: smtp.resend.com   # or your provider's host
      #    SMTP_PORT: 587
      #
      # Common optional overrides:
      #   SMTP_SECURE: "true"   # use SSL on port 465 instead of STARTTLS on 587
      #   SMTP_FROM: Planly <noreply@yourdomain.com>
      #   APP_URL: https://planly.yourdomain.com  # base URL used in email links
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  db_data:
  uploads_data:
