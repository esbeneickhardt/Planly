services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planly
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Port 3000 is intentionally NOT exposed to the host.
    # The backend is only reachable through the Nginx reverse proxy.
    environment:

      # ── Mandatory ─────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Emergency crown transfer - set to an existing user's email, restart once, then remove
      RECROWN_EMAIL: ${RECROWN_EMAIL:-}

      # ── Server ────────────────────────────────────────────────────────────
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-80}
      UPLOADS_DIR: /data/uploads
      # Number of reverse-proxy hops in front of the backend (1 = Nginx layer)
      TRUSTED_PROXY_DEPTH: "${TRUSTED_PROXY_DEPTH:-1}"
      # Set to "false" for HTTP-only local dev; defaults to true (HTTPS)
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"

      # ── Admin account ─────────────────────────────────────────────────────
      # Set before first start to use a known password instead of a generated one
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # ── Email / SMTP (optional) ────────────────────────────────────────────
      # Recommended: configure via Admin -> Email in the UI after first login.
      # Alternative: set SMTP_* in .env and they are picked up here automatically.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-}

      # ── Single Sign-On / OIDC (optional) ──────────────────────────────────
      # Set credentials in .env - see .env.example for provider examples.
      # Callback URL to register with your provider: <APP_URL>/api/auth/sso/callback
      # OIDC_ISSUER: ${OIDC_ISSUER}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_PROVIDER_NAME: Google
      # OIDC_SCOPES: openid email profile
      # APP_URL: https://planly.yourdomain.com

      # ── File Storage / S3 (optional) ───────────────────────────────────────
      # By default uploads are stored locally in ./data/uploads.
      # Set AWS_S3_BUCKET in .env to switch to S3-compatible storage.
      # See .env.example for AWS, Scaleway, and MinIO examples.
      # AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      # AWS_REGION: ${AWS_REGION}
      # AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_S3_PREFIX: ${AWS_S3_PREFIX}

      # ── Security alerting (optional) ──────────────────────────────────────
      # POST webhook fired on account lockouts; supports Slack, Discord, or any JSON endpoint
      SECURITY_ALERT_WEBHOOK_URL: ${SECURITY_ALERT_WEBHOOK_URL:-}

      # ── Observability ─────────────────────────────────────────────────────
      # Required to access GET /api/metrics — omitting this blocks the endpoint entirely
      METRICS_SECRET: ${METRICS_SECRET:-}
      # trace / debug / info / warn / error / fatal (default: info)
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # How many days of admin audit logs to retain (default: 90)
      ADMIN_LOG_RETENTION_DAYS: ${ADMIN_LOG_RETENTION_DAYS:-90}

      # ── Rate limits ────────────────────────────────────────────────────────
      # Higher limits so E2E test suites don't exhaust the per-IP budgets
      RATE_LIMIT_LOGIN_MAX: "1000"
      RATE_LIMIT_REGISTER_MAX: "1000"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis (optional) ──────────────────────────────────────────────────────
  # Required for WebSocket horizontal scaling across multiple backend replicas.
  # After enabling: add REDIS_URL=redis://redis:6379 to the backend environment.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --save 60 1 --loglevel warning
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  # ── MinIO (optional) ──────────────────────────────────────────────────────
  # Self-hosted S3-compatible object storage with a web UI at http://localhost:9001
  # After enabling, add to .env: AWS_S3_BUCKET=planly, AWS_ENDPOINT_URL=http://minio:9000
  # AWS_REGION=us-east-1, AWS_ACCESS_KEY_ID=planly, AWS_SECRET_ACCESS_KEY=changeme
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio_data:/data
  #   environment:
  #     MINIO_ROOT_USER: planly
  #     MINIO_ROOT_PASSWORD: changeme
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ── Prometheus (optional) ─────────────────────────────────────────────────
  # Scrapes /api/metrics on the backend. Requires METRICS_SECRET in .env.
  # Access Prometheus UI at http://localhost:9090
  #
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #
  # prometheus.yml example:
  #   scrape_configs:
  #     - job_name: planly
  #       scrape_interval: 15s
  #       static_configs:
  #         - targets: ['backend:3000']
  #       metrics_path: /api/metrics

volumes:
  db_data:
  uploads_data:
  # redis_data:      # uncomment when enabling Redis above
  # minio_data:      # uncomment when enabling MinIO above
  # prometheus_data: # uncomment when enabling Prometheus above
