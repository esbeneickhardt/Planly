services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planly
    ports:
      # Bound to localhost only - lets a local DB GUI tool connect without exposing Postgres to
      # the internet on hosts with no firewall (nothing else in this stack needs the host-side
      # binding; the backend reaches this over the internal Docker network at db:5432).
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${UPLOADS_DIR}:/data/uploads
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Port 3000 is intentionally NOT exposed to the host.
    # The backend is only reachable through the Nginx reverse proxy.
    environment:

      # ── Mandatory ─────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
      # Only set when using PgBouncer — points migrations directly at Postgres,
      # bypassing the pooler (prisma migrate deploy is incompatible with transaction mode).
      # DATABASE_DIRECT_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Emergency crown transfer - set to an existing user's email, restart once, then remove
      RECROWN_EMAIL: ${RECROWN_EMAIL:-}

      # ── Server ────────────────────────────────────────────────────────────
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:80}
      UPLOADS_DIR: /data/uploads
      # Number of reverse-proxy hops in front of the backend (1 = Nginx layer)
      TRUSTED_PROXY_DEPTH: "${TRUSTED_PROXY_DEPTH:-1}"
      # Set to "false" for HTTP-only local dev; defaults to true (HTTPS)
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"

      # ── Admin account ─────────────────────────────────────────────────────
      # Set before first start to use a known password instead of a generated one
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # ── Email / SMTP (optional) ────────────────────────────────────────────
      # Recommended: configure via Admin -> Email in the UI after first login.
      # Alternative: set SMTP_* in .env and they are picked up here automatically.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-}

      # ── Single Sign-On / OIDC (optional) ──────────────────────────────────
      # Set credentials in .env - see .env.example for provider examples.
      # Callback URL to register with your provider: <APP_URL>/api/auth/sso/callback
      # OIDC_ISSUER: ${OIDC_ISSUER}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_PROVIDER_NAME: Google
      # OIDC_SCOPES: openid email profile
      # APP_URL: https://planly.yourdomain.com

      # ── File Storage / S3 (optional) ───────────────────────────────────────
      # By default uploads are stored locally in ./data/uploads.
      # Set S3_BUCKET in .env to switch to S3-compatible storage.
      # See .env.example for AWS, Scaleway, and MinIO examples.
      # S3_BUCKET: ${S3_BUCKET}
      # S3_REGION: ${S3_REGION}
      # S3_ENDPOINT: ${S3_ENDPOINT}
      # S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      # S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # S3_PREFIX: ${S3_PREFIX}

      # ── Security alerting (optional) ──────────────────────────────────────
      # POST webhook fired on account lockouts; supports Slack, Discord, or any JSON endpoint
      SECURITY_ALERT_WEBHOOK_URL: ${SECURITY_ALERT_WEBHOOK_URL:-}

      # ── Observability ─────────────────────────────────────────────────────
      # Required to access GET /api/metrics — omitting this blocks the endpoint entirely
      METRICS_SECRET: ${METRICS_SECRET:-}
      # trace / debug / info / warn / error / fatal (default: info)
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # How many days of admin audit logs to retain (default: 90)
      ADMIN_LOG_RETENTION_DAYS: ${ADMIN_LOG_RETENTION_DAYS:-90}

      # ── Rate limits ────────────────────────────────────────────────────────
      # Override in .env for E2E test environments (e.g. RATE_LIMIT_LOGIN_MAX=1000)
      RATE_LIMIT_LOGIN_MAX: "${RATE_LIMIT_LOGIN_MAX:-10}"
      RATE_LIMIT_REGISTER_MAX: "${RATE_LIMIT_REGISTER_MAX:-5}"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Backup (optional) ─────────────────────────────────────────────────────
  # Hourly backup of DB + uploads to a host directory. Identical to the prod setup.
  # Enable by uncommenting below and setting BACKUP_DIR in .env (default: ./backups).
  # Note: requires /var/run/docker.sock access and a running db container named planly-db.
  #
  # backup:
  #   image: docker:cli
  #   restart: unless-stopped
  #   entrypoint: >
  #     sh -c "
  #       while true; do
  #         sleep 3600
  #         DB_CONTAINER=$$(docker ps --filter name=planly-db --format '{{.Names}}' | head -1)
  #         TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
  #         mkdir -p /backups/planly/$$TIMESTAMP
  #         docker exec $$DB_CONTAINER pg_dump -U planly planly | gzip > /backups/planly/$$TIMESTAMP/db.sql.gz
  #         tar -czf /backups/planly/$$TIMESTAMP/uploads.tar.gz -C /uploads . 2>/dev/null || true
  #         find /backups/planly -maxdepth 1 -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true
  #         echo \"[$$TIMESTAMP] Backup complete\"
  #       done
  #     "
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ${UPLOADS_DIR}:/uploads:ro
  #     - ${BACKUP_DIR:-./backups}:/backups
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # ── Redis (optional) ──────────────────────────────────────────────────────
  # Required for WebSocket horizontal scaling across multiple backend replicas.
  # After enabling: add REDIS_URL=redis://redis:6379 to the backend environment.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --save 60 1 --loglevel warning
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  # ── MinIO (optional) ──────────────────────────────────────────────────────
  # Self-hosted S3-compatible object storage with a web UI at http://localhost:9001
  # After enabling, add to .env: S3_BUCKET=planly, S3_ENDPOINT=http://minio:9000
  # S3_REGION=us-east-1, S3_ACCESS_KEY_ID=planly, S3_SECRET_ACCESS_KEY=changeme
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio_data:/data
  #   environment:
  #     MINIO_ROOT_USER: planly
  #     MINIO_ROOT_PASSWORD: changeme
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ── PgBouncer (optional) ─────────────────────────────────────────────────
  # Connection pooler — only needed when multiple backend replicas each maintain
  # their own Prisma pool and the total connection count approaches PostgreSQL's
  # max_connections (default: 100). A single backend instance does not need this.
  #
  # When enabling:
  #   1. Uncomment the pgbouncer service below.
  #   2. In the backend environment above, change DATABASE_URL to point at PgBouncer:
  #        DATABASE_URL: postgresql://planly:${DB_PASSWORD}@pgbouncer:5432/planly?pgbouncer=true
  #      The ?pgbouncer=true flag disables Prisma features incompatible with transaction mode.
  #   3. Add DATABASE_DIRECT_URL so migrations bypass PgBouncer (required — prisma migrate
  #      deploy cannot run through a transaction-mode pooler):
  #        DATABASE_DIRECT_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
  #
  # pgbouncer:
  #   image: bitnami/pgbouncer:latest
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     POSTGRESQL_HOST: db
  #     POSTGRESQL_PORT: 5432
  #     POSTGRESQL_USERNAME: planly
  #     POSTGRESQL_PASSWORD: ${DB_PASSWORD}
  #     POSTGRESQL_DATABASE: planly
  #     PGBOUNCER_DATABASE: planly
  #     PGBOUNCER_POOL_MODE: transaction
  #     PGBOUNCER_MAX_CLIENT_CONN: 1000
  #     PGBOUNCER_DEFAULT_POOL_SIZE: 20
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U planly || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  # ── Prometheus (optional) ─────────────────────────────────────────────────
  # Scrapes /api/metrics on the backend. Requires METRICS_SECRET in .env.
  # Alert rules are defined in monitoring/alerts.yml.
  # Access Prometheus UI at http://localhost:9090
  #
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"

volumes:
  db_data:
  # redis_data:      # uncomment when enabling Redis above
  # minio_data:      # uncomment when enabling MinIO above
  # prometheus_data: # uncomment when enabling Prometheus above
