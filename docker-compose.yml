services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planly
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
      JWT_SECRET: ${JWT_SECRET}
      # ── Encryption (required) ────────────────────────────────────────────────
      # Separate 256-bit key for encrypting secrets at rest (SMTP passwords,
      # webhook secrets). Generate with: openssl rand -hex 32
      # Add to .env:  ENCRYPTION_KEY=<64-char hex string>
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-80}
      UPLOADS_DIR: /data/uploads
      # Tells the backend how many reverse-proxy hops sit in front of it so it
      # can read the real client IP from X-Forwarded-For. 1 = one Nginx layer.
      TRUSTED_PROXY_DEPTH: "1"
      # Set to "false" for HTTP-only environments (local dev, CI). Defaults to true (HTTPS).
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      # ── Email (optional) ────────────────────────────────────────────────────
      # RECOMMENDED: configure email through the UI after first login.
      #   Settings → Email → fill in host/port/credentials → Save.
      #   Credentials are stored in the database — nothing goes in this file.
      #
      # ALTERNATIVE: env vars (credentials go in .env, NOT here — see below).
      #   Add to .env:        SMTP_HOST=smtp.gmail.com
      #                       SMTP_PORT=587
      #                       SMTP_USER=you@gmail.com
      #                       SMTP_PASS=your-app-password   ← keep out of this file
      #   Then reference here (no quotes, no plain values):
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      #
      # The .env file is listed in .gitignore and never committed.
      # UI config takes priority over env vars when both are present.
      #
      # Optional overrides (safe to set here — not secret):
      #   APP_URL: https://planly.yourdomain.com  # base URL used in email links
      #
      # ── Admin (optional) ────────────────────────────────────────────────────
      # Set ADMIN_EMAIL to designate the founding server admin.
      # Whoever registers (or already has an account) with this email gets
      # isAdmin + isFoundingAdmin on startup. The /admin panel becomes visible.
      #
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      #
      # ── File uploads: S3-compatible object storage (optional) ────────────────
      # By default uploads are stored in ./data/uploads on the host (bind mount).
      # Set AWS_S3_BUCKET in .env to switch to S3-compatible storage instead.
      # See .env.example for Scaleway Object Storage and MinIO examples.
      # AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      # AWS_REGION: ${AWS_REGION}
      # AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_S3_PREFIX: ${AWS_S3_PREFIX}
      #
      # Higher rate limits so E2E test suites don't exhaust the per-IP budgets.
      RATE_LIMIT_LOGIN_MAX: "1000"
      RATE_LIMIT_REGISTER_MAX: "1000"
      # Optionally enforce email verification before users can sign in:
      #   REQUIRE_EMAIL_VERIFICATION: "true"
      #
      # Optionally restrict registration to an allowlist (managed in /admin):
      #   REQUIRE_WHITELIST: "true"
      #
      # ── Single Sign-On / OIDC (optional) ────────────────────────────────────
      # Enables a "Sign in with <provider>" button on the login page.
      # Works with any OpenID Connect provider (Google, Microsoft, Auth0, Okta, …).
      # Credentials go in .env — reference them here:
      # OIDC_ISSUER: ${OIDC_ISSUER}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_PROVIDER_NAME: Google         # label shown on the login button (default: SSO)
      # OIDC_SCOPES: openid email profile  # default — change only if your IdP requires it
      #
      # The callback URL to register with your identity provider:
      #   <APP_URL>/api/auth/sso/callback
      # Set APP_URL to your public backend URL so the redirect is correct:
      # APP_URL: https://planly.yourdomain.com
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # Port 3000 is intentionally NOT exposed to the host — the backend is only
    # reachable via the Docker network through the Nginx reverse proxy.
    # WARNING: this file is for LOCAL DEVELOPMENT ONLY.
    # In production always use docker-compose.prod.yml (Traefik + TLS, no direct port exposure).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Optional: Redis (required for WebSocket horizontal scaling) ─────────────
  # When running multiple backend replicas, enable Redis so real-time events are
  # shared across all instances (no sticky load balancer needed).
  # After enabling: add REDIS_URL=redis://redis:6379 to the backend environment block.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --save 60 1 --loglevel warning
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  # ── Optional: Prometheus metrics scraper ─────────────────────────────────────
  # Scrapes /api/metrics on the backend. Requires METRICS_SECRET in .env.
  # Access Prometheus UI at http://localhost:9090
  #
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #
  # prometheus.yml example:
  #   scrape_configs:
  #     - job_name: planly
  #       scrape_interval: 15s
  #       static_configs:
  #         - targets: ['backend:3000']
  #       metrics_path: /api/metrics
  #       params:
  #         _: [''] # empty param to satisfy URL reuse
  #       # If METRICS_SECRET is set, uncomment:
  #       # authorization:
  #       #   credentials: <your-secret>
  #       # Use headers instead:
  #       # params: {}
  #       # Add X-Metrics-Secret via relabeling or a dedicated proxy

  # ── Optional: MinIO self-hosted object storage ──────────────────────────────
  # Uncomment to get an S3-compatible local object store with a web UI.
  # After enabling, set these in .env:
  #   AWS_S3_BUCKET=planly
  #   AWS_ENDPOINT_URL=http://minio:9000
  #   AWS_REGION=us-east-1
  #   AWS_ACCESS_KEY_ID=planly
  #   AWS_SECRET_ACCESS_KEY=changeme
  # The existing storage.ts in the backend picks up AWS_ENDPOINT_URL automatically.
  # Web UI is available at http://localhost:9001 (login: planly / changeme)
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio_data:/data
  #   environment:
  #     MINIO_ROOT_USER: planly
  #     MINIO_ROOT_PASSWORD: changeme
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  db_data:
  # redis_data:      # uncomment when enabling Redis above
  # prometheus_data: # uncomment when enabling Prometheus above
  # minio_data:      # uncomment when enabling MinIO above
