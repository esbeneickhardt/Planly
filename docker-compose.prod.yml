services:
  traefik:
    image: traefik:v3.3
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: planly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planly
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planly"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://planly:${DB_PASSWORD}@db:5432/planly
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_ORIGIN: https://${DOMAIN}
      APP_URL: https://${DOMAIN}
      UPLOADS_DIR: /data/uploads
      LOG_LEVEL: info
      TRUSTED_PROXY_DEPTH: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # SMTP (optional - leave empty to log emails to console)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Planly <noreply@planly.app>}
    volumes:
      - uploads_data:/data/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Port 3000 is intentionally NOT exposed to host - backend only via Docker network

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.planly.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.planly.entrypoints=websecure"
      - "traefik.http.routers.planly.tls.certresolver=le"
      - "traefik.http.services.planly.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Automated hourly backup - dumps DB + uploads to /backups on the host
  backup:
    image: docker:cli
    restart: always
    entrypoint: >
      sh -c "
        while true; do
          sleep 3600
          DB_CONTAINER=$$(docker ps --filter name=planly-db --format '{{.Names}}' | head -1)
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          mkdir -p /backups/planly/$$TIMESTAMP
          docker exec $$DB_CONTAINER pg_dump -U planly planly | gzip > /backups/planly/$$TIMESTAMP/db.sql.gz
          tar -czf /backups/planly/$$TIMESTAMP/uploads.tar.gz -C /uploads . 2>/dev/null || true
          find /backups/planly -maxdepth 1 -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true
          echo \"[$$TIMESTAMP] Backup complete\"
        done
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - uploads_data:/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads_data:
  letsencrypt_data:
