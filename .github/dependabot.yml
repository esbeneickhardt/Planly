version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive grouped; each major upgrade gets its own PR,
    # since a major (React 19, Prisma 7, TypeScript 7 ...) is a migration that a
    # grouped PR can't pass on its own.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # TypeScript 7 (the native compiler) waits until typescript-eslint supports it;
    # its peer range is still <6.1.0. Drop this once that changes.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive grouped; each major upgrade gets its own PR,
    # since a major (React 19, Prisma 7, TypeScript 7 ...) is a migration that a
    # grouped PR can't pass on its own.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # TypeScript 7 (the native compiler) waits until typescript-eslint supports it;
    # its peer range is still <6.1.0. Drop this once that changes.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
