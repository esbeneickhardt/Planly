name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

jobs:
  audit-backend:
    name: Backend npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend

  audit-frontend:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  lint-backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  lint-frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  typecheck-backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend

  trivy-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A pinned release checked against its published checksum, rather than
      # piping the install script from Trivy's main branch into sh (which also
      # stopped working on the Ubuntu 26.04 runners).
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: Build backend image
        run: docker build -t planly-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t planly-frontend:ci ./frontend
      - name: Scan backend image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed planly-backend:ci
      - name: Scan frontend image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed planly-frontend:ci

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx @cyclonedx/cyclonedx-npm --output-format json --output-file sbom-backend.json
        working-directory: backend
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: frontend
      - run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format json --output-file sbom-frontend.json
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/sbom-backend.json
            frontend/sbom-frontend.json
          retention-days: 90
