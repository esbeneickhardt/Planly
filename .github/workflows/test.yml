name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx vitest run src/__tests__/unit
        working-directory: backend

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planly
          POSTGRES_PASSWORD: planly_test
          POSTGRES_DB: planly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://planly:planly_test@localhost:5432/planly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Apply schema to test database
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://planly:planly_test@localhost:5432/planly_test
      - run: npx vitest run src/__tests__/integration --reporter=verbose
        working-directory: backend

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  format-check:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - name: Check backend formatting
        run: npm run format:check
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: frontend
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # E2E tests run against the Docker stack; skip on PRs from forks
    # where secrets are unavailable, and only run when SKIP_E2E is not set.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package.json
      - name: Install e2e dependencies
        run: npm install
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Create CI env file
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "SMTP_HOST="
            echo "SMTP_PORT=587"
            echo "SMTP_USER="
            echo "SMTP_PASS="
            echo "ADMIN_EMAIL=${{ secrets.E2E_ADMIN_EMAIL }}"
            echo "ADMIN_PASSWORD=${{ secrets.E2E_ADMIN_PASSWORD }}"
            echo "UPLOADS_DIR=./data/uploads"
            echo "RATE_LIMIT_LOGIN_MAX=1000"
            echo "RATE_LIMIT_REGISTER_MAX=1000"
            echo "COOKIE_SECURE=false"
          } > .env
      - name: Start app stack
        run: |
          cp docker-compose.yml docker-compose.ci.yml
          docker compose -f docker-compose.ci.yml up -d --build
          # Wait for backend health endpoint
          for i in $(seq 1 30); do
            curl -sf http://localhost/api/health/ready && break
            sleep 5
          done
      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Stop app stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
